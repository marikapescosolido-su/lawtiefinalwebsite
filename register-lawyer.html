<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Pro-bono lawyer registration | Law-Tie</title><link rel="stylesheet" href="styles.css" /></head>
  <body class="page-register page-register-lawyer">
    <div class="cursor-bg" aria-hidden="true"><div class="cursor-bg__glow"></div><div class="cursor-bg__focus"></div><div class="cursor-bg__sheet"></div><div class="cursor-bg__ribbons"></div><div class="cursor-bg__engraving"></div><div class="cursor-bg__threads"></div></div>
    <nav class="nav" id="nav"><a class="brand" href="index.html"><img src="media/law-tie-logo-with-bg.png" alt="Law-Tie logo" /><span>Law<span>-</span>Tie</span></a><a class="button button-small" href="be-part.html">Back</a></nav>
    <main class="page-main"><section class="form-shell page-section"><div class="form-intro reveal"><span class="eyebrow">Pro-bono lawyer</span><h1>Register your practice</h1><p>Tell us where and how you practise so we can contact you about relevant collaborations.</p></div>
      <form class="registration-form reveal" action="mailto:lawtie.org@gmail.com?subject=Law-Tie%20pro-bono%20lawyer%20registration" method="post" enctype="text/plain"><div class="form-grid"><label>Full name<input name="Full name" autocomplete="name" required /></label><label>Professional email<input type="email" name="Email" autocomplete="email" required /></label><label>Firm, office, or organization<input name="Organization" required /></label><label>Role or title<input name="Role" required /></label><label>Jurisdiction(s) of practice<input name="Jurisdictions" required /></label><label>Bar or professional body<input name="Professional body" /></label><label>Areas of law<input name="Areas of law" required /></label><label>Languages<input name="Languages" required /></label></div><label>Pro-bono experience and availability<textarea name="Experience and availability" rows="6"></textarea></label><fieldset><legend>Consent</legend><label class="check"><input type="checkbox" name="Contact consent" value="Yes" required /><span>I consent to Law-Tie contacting me about cases and program participation.</span></label><label class="check"><input type="checkbox" name="Accuracy" value="Yes" required /><span>I confirm that the professional information provided is accurate.</span></label></fieldset><button class="button" type="submit">Send registration</button><p class="form-note">Submitting opens your email app so you can review the information before sending it to Law-Tie.</p></form>
    </section></main><footer><strong>Law<span>Tie</span></strong><p>© 2026 Law-Tie. All rights reserved.</p></footer><script src="script.js"></script>
  </body>
</html>
